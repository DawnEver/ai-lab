[build-system]
requires = ["setuptools>=77.0.3", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_lab"
dynamic = ["version"]
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Vendor-neutral typed decisions and schema-bound responses from any model"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Mingyang Bao" }]
# HTTP is urllib and the provider table is tomllib. lab-commons supplies what the family already owns:
# the config search path (`paths`) and the key store (`credentials`).
dependencies = [
    "lab-commons[paths] @ git+https://gitea.mingyangbao.site/Tianjie-Zou-Team/lab-commons.git",
]

[project.optional-dependencies]
# The family's development kit: rules registry, rendered configs, shared test bodies, verify entry.
dev = [
    "lab-commons[dev] @ git+https://gitea.mingyangbao.site/Tianjie-Zou-Team/lab-commons.git",
    "pytest",
    "ruff",
]

[tool.setuptools_scm]
version_file = "src/ai_lab/__version__.py"
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_lab*"]

[tool.setuptools.package-data]
ai_lab = ["providers.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: calls a real model (network or a local CLI); run with -m live",
    "workstation: needs a developer workstation -- the live checkout (hooks, branches on origin, worktree placement); the cluster's per-sha tree has none",
    "sharp_review: reads sharp-review's method data in place -- the host's [capabilities.sharp_review] path, a cc-market checkout's sharp-review/method",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "A", "AIR", "ANN", "ARG", "ASYNC", "B", "BLE", "C4", "C90", "COM", "D", "DJ", "DTZ", "E", "EM", "ERA",
    "F", "FA", "FBT", "FIX", "FLY", "FURB", "G", "I", "ICN", "INP", "INT", "ISC", "LOG", "N", "NPY", "PD",
    "PERF", "PGH", "PIE", "PLC", "PLE", "PLR", "PLW", "PT", "PTH", "PYI", "Q", "RET", "RSE", "RUF", "S",
    "SIM", "SLF", "SLOT", "T10", "T20", "TD", "TID", "TRY", "UP", "W", "YTT",
]
ignore = ["COM812", "D203", "D213", "D400", "D401", "N818", "PLR0913", "Q000", "Q003", "S603"]

[tool.ruff.lint.per-file-ignores]
# A test asserts, reads private seams of what it tests, and names fixtures rather than documenting them.
"tests/**" = ["S101", "SLF001", "D", "ANN", "ARG", "FBT003", "PLR2004", "PT018", "INP001"]

[tool.lab_commons.branchset]
trunk = 'main'
sessions = ['integrate/main']
ephemeral = ['pr/*']  # a short-lived PR head, pushed with no row and deleted by the forge with its merge
prune_merged = true

[tool.lab_commons.hpc]
# PIN + FRESHNESS (user ruling 2026-10-17): the venv is exactly the committed lock, and the lock keys it.
install = 'uv sync --frozen --extra dev'
dependency_inputs = ['pyproject.toml', 'uv.lock']
source_roots = ['src']
collect = 'tests'

[tool.lab_commons.parts]
output = "output/logs"

[tool.lab_commons.tests]
produce = ["-m", "lab_commons.dev.verify", "--part", "{part}"]
resources = ["workstation", "sharp_review"]

# The family branch flow: integrate/main coordinates; main moves only by `integrate promote` (fast-forward)
# on a full forge PASS. Adopted 2026-10-18 (user ruling: every repo runs the lab-commons principles):
# integrate/main is cut at the adoption commit (the first with a committed lock), every later commit a merge.
[tool.lab_commons.integrator]
trunk = "main"
integration = "integrate/main"
pr_merges_since = "9d016300ccc6b19cad75729b8c4f22ad21817a03"  # INTEGRATION-TAKES-ONLY-FORGE-MERGES from here

# Git hooks: the family base (lab_commons/dev/githooks/base.toml) as is; ai-lab adds no row.
[tool.lab_commons.hooks]

[tool.lab_commons.doors]
BARE-TEST-INVOCATION = "<venv python> -m lab_commons.dev.verify [-- <pytest args>]  (the verdict door; a hand-written pytest line has none)"
PUSH-NO-VERIFY = "<venv python> -m lab_commons.dev.verify, then push without skipping the hook"
GIT-NETWORK-VERB = "<venv python> -m lab_commons.dev.netverb -- git <push|fetch|pull|clone|ls-remote> ...  (retries 3x, then reports a diagnosis)"
ENV-MUTATION-THROUGH-THE-DOOR = "<any family venv python> -m lab_commons.dev.dep --bootstrap <this checkout> --extra dev  (run from this checkout)"
