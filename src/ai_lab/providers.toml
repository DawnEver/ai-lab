# THE ONE PROVIDER CATALOGUE (published by `python -m ai_lab.providers --json`). Vendors are DATA. A
# row names its default wire (a module in ai_lab/wire, speaking one protocol), where it is reached (a
# `url` origin plus a `<protocol>_path` for each protocol the account serves: openai, anthropic, gemini,
# typesafe), the Claude-class role models a host launcher projects (`models`, keys base fable opus
# sonnet haiku subagent codex; base is required and the default of the rest), the conventional name of its key ("" = none needed; the key itself is in the git
# credential store under the endpoint's host, never in the environment -- `python -m ai_lab.auth login
# <provider>`), whether it reads images, the billing vendor the price catalogs know it as ("" =
# unmetered), and its AUTH KIND (ai_lab.client.AUTH_KINDS): "api" (a keyed account, billed per token)
# or "local" (a keyless server you run). ai-lab is the pay-per-token API layer only; retired spellings
# are refused by name (ai_lab.retired). Which verbs a row has is read off the wire's code, never here.
# A row may declare "model_wires" = {model = wire}: a model of the SAME account that one wire of
# its vendor serves instead of the row's default (OpenAI's /decisions endpoint serves gpt-6-luna).
# One provider is ONE ACCOUNT KIND OF ONE VENDOR; a second door into an account is a model_wires entry,
# never a second row. An "api" row's keys are ordered slots (`login <provider> --slot N`).
# Add a row in your own providers.toml (ai_lab.client.user_providers_file); a row there replaces one here.

[openai]
wire = "openai_responses"
url = "https://api.openai.com"
openai_path = "/v1"
key_name = "OPENAI_API_KEY"
vision = true
vendor = "openai"
auth = "api"
model_wires = { "gpt-6-luna" = "openai_decisions" }

[typesafe]
wire = "typesafe"
url = "https://api.typesafe.ai"
typesafe_path = "/v1"
key_name = "TYPESAFE_API_KEY"
vision = false
auth = "api"

[anthropic]
wire = "anthropic_messages"
url = "https://api.anthropic.com"
anthropic_path = "/v1"
key_name = "ANTHROPIC_API_KEY"
vision = true
vendor = "anthropic"
auth = "api"
models = { base = "claude-sonnet-5-5", sonnet = "claude-sonnet-5-5", opus = "claude-opus-5-5", haiku = "claude-haiku-5-5", fable = "claude-fable-5-1" }

[gemini]
wire = "gemini"
url = "https://generativelanguage.googleapis.com"
gemini_path = "/v1beta"
key_name = "GEMINI_API_KEY"
vision = true
vendor = "google"
auth = "api"

[openrouter]
wire = "openai_chat"
url = "https://openrouter.ai"
openai_path = "/api/v1"
key_name = "OPENROUTER_API_KEY"
vision = true
vendor = "openrouter"
auth = "api"

[deepseek]
wire = "openai_chat_json"
url = "https://api.deepseek.com"
openai_path = "/v1"
anthropic_path = "/anthropic"
key_name = "DEEPSEEK_API_KEY"
vision = false
vendor = "deepseek"
auth = "api"
models = { base = "deepseek-v4-flash[1m]", fable = "deepseek-v4-pro[1m]", opus = "deepseek-v4-flash[1m]", sonnet = "deepseek-v4-flash[1m]", haiku = "deepseek-v4-flash[1m]", subagent = "deepseek-v4-flash[1m]" }

[qwen]
wire = "openai_chat"
url = "https://dashscope.aliyuncs.com"
openai_path = "/compatible-mode/v1"
key_name = "DASHSCOPE_API_KEY"
vision = true
vendor = "alibaba"
auth = "api"

[ollama]
wire = "openai_chat"
url = "http://localhost:11434"
openai_path = "/v1"
key_name = ""
vision = true
auth = "local"
