# Vendors are DATA. A row names its wire (a protocol module in ai_lab/wire), where it is reached
# (a base URL), the conventional name of its key ("" = none needed; the key itself is in the git
# credential store under the endpoint's host, never in the environment -- `python -m ai_lab.auth login
# <provider>`), whether it reads images, the billing vendor the price catalogs know it as ("" =
# unmetered), and its AUTH KIND (ai_lab.client.AUTH_KINDS): "api" (a keyed account, billed per token)
# or "local" (a keyless server you run). ai-lab is the pay-per-token API layer only; retired spellings
# are refused by name (ai_lab.retired). Which verbs a row has is read off the wire's code, never here.
# A row may declare "model_wires" = {model = wire}: a model of the SAME account that one wire of
# its vendor serves instead of the row's default (OpenAI's /decisions endpoint serves gpt-6-luna).
# One provider is ONE ACCOUNT KIND OF ONE VENDOR; a second door into an account is a model_wires entry,
# never a second row. An "api" row's keys are ordered slots (`login <provider> --slot N`).
# Add a row in your own providers.toml (ai_lab.client.user_providers_file); a row there replaces one here.

[openai]
wire = "openai_responses"
endpoint = "https://api.openai.com/v1"
key_name = "OPENAI_API_KEY"
vision = true
vendor = "openai"
auth = "api"
model_wires = { "gpt-6-luna" = "openai_decisions" }

[typesafe]
wire = "typesafe"
endpoint = "https://api.typesafe.ai/v1"
key_name = "TYPESAFE_API_KEY"
vision = false
auth = "api"

[anthropic]
wire = "anthropic_messages"
endpoint = "https://api.anthropic.com/v1"
key_name = "ANTHROPIC_API_KEY"
vision = true
vendor = "anthropic"
auth = "api"

[gemini]
wire = "gemini"
endpoint = "https://generativelanguage.googleapis.com/v1beta"
key_name = "GEMINI_API_KEY"
vision = true
vendor = "google"
auth = "api"

[openrouter]
wire = "openai_chat"
endpoint = "https://openrouter.ai/api/v1"
key_name = "OPENROUTER_API_KEY"
vision = true
