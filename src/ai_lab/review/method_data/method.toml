schema_version = 3
provider_assignment = "reviewer i takes providers[i mod len(providers)]; a requested provider absent from the available set is status unavailable, never substituted"

[files]
profiles = "profiles.toml"
finding_schema = "finding.schema.json"
output_schema = "findings-output.schema.json"
conformance = "conformance"

[pick]
count = 2
algorithm = "weighted_without_replacement"
eligible = "profiles whose source fired; every profile when no source is given"
empty_fallback = "diff"
assignment = "shuffled"

[contexts.diff.review]
template = "prompts/diff.md"
call_mode = "review"

[contexts.diff.agent]
template = "prompts/agent-diff.md"
call_mode = "agent"

[contexts.diff.small]
template = "prompts/small-diff.md"
call_mode = "explore"

[contexts.diff.medium]
template = "prompts/medium-diff.md"
call_mode = "explore"

[contexts.diff.huge]
template = "prompts/huge-diff.md"
call_mode = "explore"

[contexts.diff.empty]
status = "skipped"

[contexts.explore.any]
template = "prompts/explore.md"
call_mode = "agent"

[template]
placeholder = "{{name}}"
missing = ""
list_join = "; "
collapse_blank_lines = true
trim = true

[template.partials]
rules = "prompts/rules.md"
output_contract = "prompts/output-contract.md"
requests = "prompts/requests.md"
requirements = "prompts/requirements.md"

[run_modes.interactive]
call_modes = [
  "review",
  "agent",
]
synthesis = false
sink = "report"

[run_modes.interactive.providers]
from = "available"
order = "alphabetical"
rotate_by = "seed"
count = 2

[run_modes.interactive.models]
anthropic = "opus"
claude = "opus"

[run_modes.headless]
providers = [
  "anthropic",
]
contexts = [
  "diff",
]
call_modes = [
  "explore",
]
synthesis = false
sink = "stdout"

[run_modes.headless.models]

[run_modes.headless.judge_models]
anthropic = "claude-opus-5-5"

[reviewer_status]
vocabulary = [
  "ok",
  "exhausted",
  "auth",
  "rate_limit",
  "timeout",
  "unsupported",
  "unavailable",
  "skipped",
]
failure_kinds = [
  "exhausted",
  "auth",
  "rate_limit",
  "timeout",
  "unsupported",
]
planned_final = [
  "unavailable",
  "skipped",
  "unsupported",
]
precedence = [
  "planned_final",
  "missing_result:unavailable",
  "error_kind",
  "placeholder_reply:unavailable",
  "findings_array:ok",
  "otherwise:unavailable",
]
placeholder_replies = [
  "^\\s*\\(no findings",
]
error = "every reviewer whose status is neither ok nor skipped carries a non-empty error naming why: the recorded error text (the result's `error`, else the planned reviewer's `error`) when it is a non-empty string, else the reason of the precedence rule that decided the status ({error_kind} replaced by the recorded kind). An ok reviewer never carries one; a skipped one carries none from the merge. The text is copied, never a key."

[reviewer_status.reasons]
missing_result = "no result came back"
error_kind = "the call failed with kind {error_kind} and recorded no error text"
placeholder_reply = "the reply was only a no-findings placeholder"
otherwise = "the reply held no findings array"

[reviewer_status.reasons.planned_final]
unavailable = "the requested provider is not available here"
unsupported = "the run mode cannot execute this reviewer's call mode"

[merge]
validate = "finding_schema"
group_order = "first_seen"
confidence = [
  { min_reviewers = 2, label = "high-confidence (≥2 reviewers)" },
  { min_reviewers = 1, label = "single-reviewer" },
]
group_by = "id"

[merge.defaults]
status = "OPEN"
suggestion = ""
detail = ""

[merge.id]
prefix = "F"
separator = "-"
hash = "sha256"
length = 12
fields = [
  "rule",
  "file",
  "anchor",
]
normalize = "each field stripped and its whitespace runs collapsed to one space; joined by a newline"
means = "a finding is the same finding in every round and every reviewer while its rule, file and anchor line are: ids never carry a line number or a date"

[merge.requirements]
reply_verdicts = [
  "met",
  "violated",
  "amended",
  "untouched",
]
precedence = [
  "violated",
  "amended",
  "unverified",
  "met",
  "untouched",
]
unverified = "unverified"
missing_evidence = "no reviewer returned a verdict on this requirement"
ungrounded_prefix = "not grounded: no cite is a file this change touches"
combine = "per requirement id, over every ok reviewer's valid rows: the verdict first in precedence wins, with its first-seen row's evidence; cites are the ordered union of every row's; a requirement no ok reviewer returned a valid row for is `unverified` with `missing_evidence`. A row naming an unknown id, a verdict outside reply_verdicts or a field of the wrong type is dropped. Listed in requirement order, and only when the caller declared a requirement"
ungrounded = "after the merge, a violated row none of whose cites (the part before the first ':') is a file the whole change touches becomes `unverified`, its evidence prefixed with ungrounded_prefix"

[merge.escalate]
severity = "the most severe any reviewer of the group gave, by severity_order"
security = "true when any reviewer of the group said true"
severity_order = [
  "HIGH",
  "MEDIUM",
  "LOW",
]

[rules]
finding_field = "rule"
sources = [
  "principles",
  "registry",
]
principles = "the family principles {id, name, statement}, given by the caller at load (--principles FILE; never imported, never copied here)"
registry = "the family rule registry's ids, given by the caller at load (--rules; never imported, never copied here)"
fills = "the finding schema property finding_field gets enum = every given principle id then every registry id, at load; no file lists them"
list_item = "- {{id}}: {{statement}}"
registry_item = "{{id}}"
prompt_schema = "unfilled"
prompt_schema_means = "filled: the prompt finding schema carries the ids enum; unfilled: it does not, since the rules partial already lists every id. Validation always uses the filled schema"
